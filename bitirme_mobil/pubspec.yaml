name: bitirme_mobil
description: "Sağlık ve Kaza Takip Sistemi - LSTM tabanlı akıllı izleme"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_database: ^11.1.3

  # UI & Durum Yönetimi
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  provider: ^6.1.2

  # Sensörler
  sensors_plus: ^6.1.1

  # BLE (Akıllı saat)
  flutter_blue_plus: ^1.35.3

  # TFLite AI (Dart 3+ uyumlu)
  tflite_flutter: ^0.11.0

  # Konum
  geolocator: ^13.0.2

  # Haberleşme (SMS + Arama)
  url_launcher: ^6.3.1
  flutter_phone_direct_caller: ^2.1.1
  telephony: ^0.2.0

  # Titreşim (Acil durum uyarısı)
  vibration: ^2.0.0

  # Depolama
  shared_preferences: ^2.3.3

  # Bildirim
  flutter_local_notifications: ^18.0.1

  # İzin
  permission_handler: ^11.3.1

  # Foreground Service (Android 14+)
  flutter_foreground_task: ^8.15.0

  # Eklenen Yeni Paketler
  record: 4.4.4
  path_provider: ^2.1.2
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/model.tflite
    - assets/kalp_aritmi_model_mobil_saf.tflite
    - assets/
